<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do Web App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="todo-card">
        <header class="app-header">
            <h1>Task Master</h1>
            <p>Organize your daily goals efficiently</p>
        </header>

        <form id="todo-form" class="input-form" onsubmit="return false;">
            <input type="text" id="task-input" placeholder="What needs to be done?" autocomplete="off">
            <button type="submit" id="add-btn" class="btn btn-add">Add Task</button>
        </form>

        <div id="error-message" class="error-message"></div>

        <section class="tasks-section">
            <div class="section-header">
                <h2>Pending Tasks</h2>
                <span id="pending-counter" class="badge badge-pending">0 pending</span>
            </div>
            <div id="pending-empty" class="empty-state">No pending tasks! Enjoy your day ✨</div>
            <ul id="pending-list" class="task-list"></ul>
        </section>

        <section class="tasks-section">
            <div class="section-header">
                <h2>Completed Tasks</h2>
                <span id="completed-counter" class="badge badge-completed">0 completed</span>
            </div>
            <div id="completed-empty" class="empty-state">No completed tasks yet.</div>
            <ul id="completed-list" class="task-list"></ul>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
